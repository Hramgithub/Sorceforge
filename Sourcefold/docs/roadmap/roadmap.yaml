schema_version: 0.1.0
roadmap_id: sourcefold-core-roadmap
title: Sourcefold Core Roadmap
updated_at: 2026-08-08
source_policy:
  canonical: Sourcefold/docs/roadmap/roadmap.yaml
  viewer: Sourcefold/docs/roadmap/roadmap_viewer.html
  reference_documents:
    - path: Sourcefold/docs/plans/20260714-sourcefold-release-roadmap/roadmap.md
      role: narrative release-roadmap snapshot
    - path: Sourcefold/docs/plans/20260714-sourcefold-version-roadmap-01-to-10/version_roadmap.md
      role: narrative version-roadmap snapshot
  sync_rule: Update roadmap.yaml first for live planning state; update Markdown only when the narrative baseline changes.
status_values:
  - proposed
  - planned
  - active
  - blocked
  - accepted
  - deferred
lanes:
  - id: phases
    title: Phases
  - id: gates
    title: Gates
  - id: decisions
    title: Decisions
  - id: core
    title: Core
  - id: optional
    title: Optional
  - id: release
    title: Release
  - id: parking
    title: Parking
nodes:
  - id: phase-0
    title: Phase 0 Release Charter
    version: pre-0.1
    lane: phases
    status: active
    linked_plan: Sourcefold/docs/plans/20260715-sourcefold-phase-0-release-charter/release_charter.md
    expectations:
      - Define 0.1 release scope and source profile.
      - Decide acceptance vocabulary and authority.
      - Decide identity, lineage, anchors, waivers, evidence, and schema evolution.
      - Produce fixture strategy and release acceptance matrix.
    readiness:
      confidence: medium
      blockers:
        - gate-01-source-profile
      unknowns:
        - Exact 0.1 source profile.
        - Canonical text and evidence formats.
    owners:
      orchestrator: gpt-5.6-terra
      architect: gpt-5.6-sol
      engineering_critic: gpt-5.6-terra
    fixtures:
      required:
        - fixture-positive-0.1
        - fixture-invalid-waiver
        - fixture-stale-lineage
      missing:
        - fixture declarations are draft-only until Phase 0 acceptance
    evidence_checklist:
      release_charter: draft
      contract_decision_log: draft
      fixture_strategy: draft
      release_acceptance_matrix: draft
    details:
      enters:
        - Current scaffold and product boundary.
        - Release and version roadmap drafts.
        - Pending Terra decisions on acceptance, lineage, anchors, waivers, evidence, and schema evolution.
      exits:
        - Release charter for 0.1.
        - Contract decision log.
        - Fixture strategy.
        - Release acceptance matrix.
      gate:
        - No module implementation starts until the charter and contract decisions are accepted.
      evidence:
        - Updated decision log.
        - Phase 0 plan/context.
        - Accepted scope matrix.
    comments:
      - id: c-phase-0-001
        author: user
        status: open
        text: Choose the first source profile before module implementation.
  - id: gate-01-source-profile
    title: Gate 1 Source Profile
    version: pre-0.1
    lane: gates
    status: active
    linked_plan: Sourcefold/docs/plans/20260715-sourcefold-phase-0-release-charter/phase_gate_component_hierarchy.md
    expectations:
      - Define Gate 1 as Phase 0 / Gate 01 / Source Profile.
      - Gather Source Profile subcomponents, parameters, and evidence requirements.
      - Keep render/OCR/taxonomy values evidence-gated until prior-work and Viral pilot evidence qualify them.
      - Block Phase 0 exit and Core 0.1 implementation until accepted or explicitly parked.
    readiness:
      confidence: medium
      blockers:
        - gate-01-qualification-protocol
        - gate-01-pre-ocr-map-model
        - gate-01-page-map-readiness-pipeline
        - decision-source-profile-0.1
        - decision-canonical-formats
        - decision-acceptance-authority
        - decision-artifact-identity
        - decision-trace-anchor-model
        - decision-waiver-policy
      unknowns:
        - Exact Viral PDF hash and selected page manifest.
        - Accepted render DPI, color mode, image container, renderer, OCR engine/config, thresholds, and RPG taxonomy.
        - Page-map readiness pipeline fixture-admission and downstream acceptance criteria after pages 002-005 proving profiles.
    owners:
      orchestrator: gpt-5.6-terra
      architect: gpt-5.6-sol
      engineering_critic: gpt-5.6-terra
      user_decision: required
    fixtures:
      required:
        - fixture-positive-0.1
        - fixture-unsupported-profile
        - fixture-column-order
      missing:
        - fixture-positive-0.1
        - fixture-unsupported-profile
        - fixture-column-order
    evidence_checklist:
      subcomponents: draft
      parameter_register: draft
      prior_work_evidence: draft
      pre_ocr_mapping_model: draft
      map_handoffs: recorded
      gate_input_package: draft
      qualification_protocol: review_ready
      today_step_plan: completed_original_plan_bounded_continuation_active
      viral_pdf_candidate: present-unqualified
      viral_pdf_hash: candidate-only
      selected_page_manifest: SPM-G1-VIRAL-001-valid_for_review
      render_ocr_benchmark_protocol: missing
      gate_acceptance_record: missing
      complex_page_ocr_input_surface_policy: candidate_policy_pending_promote_or_park
      p017_p018_full_page_geometry_probe: C01TEFG017018-candidate-only-independent-ocr-evidence
      input_surface_router_implementation_prep: C01TEISP-implemented_static_replay_validated_no_policy_promotion_no_runtime
      input_surface_router_static_replay_001_020: C01TEISP-routes-012-013-016-017-018-020-geometry_probe_required
      geometry_probe_012_013_016_017_018_020: C01TEGP012013016017018020-candidate_only_completed_no_policy_promotion
      failed_page_iteration_loop: classify_sol_terra_bounded_attempt_score_commit_compare_select_winners
    details:
      enters:
        - OCR-first user corrections.
        - Prior-work evidence index.
        - Sol and Terra hierarchy handoffs.
        - Gate 1 Qualification Protocol as methodological input before benchmark work.
        - Viral PDF candidate copy, not yet selected-page manifest.
      exits:
        - Accepted or explicitly parked Source Profile parameter register.
        - Evidence-gated benchmark protocol for render/OCR parameters.
        - Gate 1 implementation authorization decision.
      gate:
        - Gate 1 cannot unlock Phase 0 while required parameters are draft, blocked, or evidence-gated without an owner and next evidence task.
        - The Viral candidate PDF cannot be rendered, OCRed, benchmarked, or accepted before the exact protocol revision is `accepted_protocol` and a distinct bounded authorization names the exact action, inputs, outputs, limits, authority, expiry, and invalidation behavior.
        - Page-map readiness cannot unlock page-complete acceptance by itself; it routes later page-complete review packets only.
      evidence:
        - Phase/Gate/Component hierarchy.
        - Pre-OCR mapping model.
        - Prior-work evidence index.
        - Viral pilot intake hash and page manifest.
        - Render/OCR qualification protocol.
    comments:
      - id: c-gate-01-001
        author: user
        status: open
        text: Gate 1 should collect subcomponents, parameters, and evidence before Phase 0 release charter is unblocked.
      - id: c-gate-01-002
        author: codex
        status: backlog
        text: "Draft Gate 1 Qualification Protocol as methodological input: define parameter statuses, render/OCR candidates, gold-sample protocol, mandatory pages/regions, metrics, non-waivable failures, and parameter-register update rules."
      - id: c-gate-01-003
        author: codex
        status: open
        text: "Viral PDF copied to fixtures/candidate_inputs/viral as candidate input only; selected-page manifest and processing wait for the Qualification Protocol."
      - id: c-gate-01-004
        author: codex
        status: open
        text: "P017/P018 weak-page evidence shows review text-evidence crops are not automatically OCR-safe. Full-page-derived geometry reached OK-level candidate metrics and should be promoted or parked explicitly before treating complex-page OCR policy as settled."

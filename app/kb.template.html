<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База знаний CoC</title>
<style>
:root { --bg:#f7f5f0; --panel:#fff; --ink:#1e1d1a; --muted:#6b675e; --line:#ddd8cc; --accent:#6d3b2a; --warn:#a15c00; --ok:#2f6b3a; }
@media (prefers-color-scheme: dark) { :root { --bg:#16150f; --panel:#201f19; --ink:#ece8dd; --muted:#a39e91; --line:#3a382f; --accent:#d59a7e; --warn:#e3a64a; --ok:#7cc48a; } }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
header h1 { font-size:18px; margin:0 8px 0 0; }
.tabs { display:flex; gap:4px; }
.tabs button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:none; color:inherit; cursor:pointer; }
.tabs button.active { background:var(--panel); border-color:var(--accent); color:var(--accent); font-weight:600; }
input, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); }
main { display:grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 58px); }
#list { border-right:1px solid var(--line); overflow:auto; max-height: calc(100vh - 58px); }
#list button { display:block; width:100%; text-align:left; padding:8px 16px; border:0; border-bottom:1px solid var(--line); background:none; color:inherit; font:inherit; cursor:pointer; }
#list button:hover, #list button.active { background:var(--panel); }
#list small { color:var(--muted); display:block; }
#card { padding:16px 24px; max-width: 900px; min-width:0; }
h2 { margin:0 0 4px; font-size:24px; }
.sub { color:var(--muted); margin-bottom:12px; }
.chars { display:grid; grid-template-columns: repeat(auto-fill, minmax(90px,1fr)); gap:6px; margin:12px 0; }
.chars div { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
.chars b { display:block; font-size:12px; color:var(--muted); font-weight:600; }
.chars span { font-size:18px; font-variant-numeric: tabular-nums; }
.chars i { display:block; font-size:11px; color:var(--muted); font-style:normal; }
table { border-collapse: collapse; width:100%; margin:8px 0; }
td, th { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:13px; }
td.num { font-variant-numeric: tabular-nums; white-space:nowrap; }
section { margin:18px 0; }
section h3 { font-size:15px; margin:0 0 6px; color:var(--accent); text-transform: uppercase; letter-spacing:.04em; }
dl { display:grid; grid-template-columns: max-content 1fr; gap:4px 12px; margin:0; }
dt { color:var(--muted); }
dd { margin:0; }
a { color:var(--accent); }
.tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; border:1px solid var(--line); margin-right:4px; }
.tag.warn { color:var(--warn); border-color:var(--warn); }
.tag.ok { color:var(--ok); border-color:var(--ok); }
.muted { color:var(--muted); }
@media (max-width: 760px) { main { grid-template-columns: 1fr; } #list { max-height: 40vh; border-right:0; border-bottom:1px solid var(--line); } #card { padding:16px; } }
</style>
</head>
<body>
<header>
  <h1>База знаний</h1>
  <div class="tabs" role="tablist">
    <button data-tab="creature">Существа</button>
    <button data-tab="character">Персонажи</button>
    <button data-tab="skill">Навыки</button>
  </div>
  <input id="q" type="search" placeholder="Поиск по имени" aria-label="Поиск">
  <select id="cat" aria-label="Фильтр"></select>
  <span id="count" class="muted"></span>
</header>
<main>
  <nav id="list"></nav>
  <article id="card"></article>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const CAT = { animal:'Зверь', mythos_monster:'Тварь Мифов', mythos_deity:'Божество Мифов', avatar:'Воплощение', supernatural:'Сверхъестественное' };
const ROLE = { npc:'NPC', pregen:'преген' };
const CH = [['STR','СИЛ'],['CON','ВЫН'],['SIZ','ТЕЛ'],['DEX','ЛВК'],['APP','НАР'],['INT','ИНТ'],['POW','МОЩ'],['EDU','ОБР']];
const BOOKS = { 'keeper-rulebook-ru': 'Книга хранителя', 'lightless-beacon-ru': 'Погасший маяк', 'malleus-keeper-deck-en': 'Malleus Keeper Deck', 'malleus-monstrorum-1-en': 'Malleus Monstrorum, т. I', 'malleus-monstrorum-2-en': 'Malleus Monstrorum, т. II' };
const METHOD = { book_text: 'сверено с книгой', helper_migration: 'перенесено из веб-помощника', mineru: 'извлечено MinerU', manual: 'введено вручную' };
const CHOOSES = { name:'имя', sex:'пол', age:'возраст', luck:'Удача', skills:'навыки', background:'предыстория' };
const BG = [['description','Описание'],['ideology','Убеждения'],['significant_people','Значимые люди'],['meaningful_locations','Значимые места'],
  ['treasured_possessions','Ценности'],['traits','Черты'],['injuries','Травмы и шрамы'],['phobias_manias','Фобии и мании'],['arcane_tomes','Тайные знания'],['encounters','Встречи со странными сущностями']];
const FILTERS = {
  creature: [['', 'Все категории'], ...Object.entries(CAT)],
  character: [['', 'Все'], ['npc', 'NPC'], ['pregen', 'Прегены']],
  skill: [['', 'Все категории'], ...[...new Set(DATA.skills.map(s => s.category))].sort().map(c => [c, c])],
};
const SET = { creature: DATA.creatures, character: DATA.characters, skill: DATA.skills };
const ALL = [...DATA.creatures, ...DATA.characters, ...DATA.skills];
const byId = id => ALL.find(x => x.id === id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bookOf = c => c.sources?.[0]?.book_id;
const kindOf = c => c.kind;
const link = (id, text) => `<a href="#" data-go="${esc(id)}">${esc(text)}</a>`;
let tab = 'creature', current = null;

function matches(c, q, f) {
  if (q && ![c.name.ru, c.name.en, ...(c.aliases||[])].some(n => (n||'').toLowerCase().includes(q))) return false;
  if (!f) return true;
  if (tab === 'creature') return c.category === f;
  if (tab === 'character') return (c.roles||[]).includes(f);
  return c.category === f;
}

function subtitle(c) {
  if (c.kind === 'creature') return `${esc(c.name.en||'')} · ${CAT[c.category]||''}${bookOf(c) !== 'keeper-rulebook-ru' ? ' · ' + esc(BOOKS[bookOf(c)] || bookOf(c)) : ''}`;
  if (c.kind === 'character') return [c.occupation?.ru, ...(c.roles||[]).map(r => ROLE[r]), BOOKS[bookOf(c)]].filter(Boolean).map(esc).join(' · ');
  return `${esc(c.name.en||'')} · база ${esc(c.base.raw)}`;
}

function renderList() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const f = document.getElementById('cat').value;
  const set = SET[tab];
  const items = set.filter(c => matches(c, q, f));
  document.getElementById('count').textContent = items.length + ' из ' + set.length;
  const list = document.getElementById('list');
  list.innerHTML = items.map(c => `<button data-id="${esc(c.id)}" class="${c.id===current?'active':''}">${esc(c.name.ru)}
    ${(c.quality?.flags||[]).filter(x => x !== 'translated').length ? '<span class="tag warn">!</span>' : ''}<small>${subtitle(c)}</small></button>`).join('');
  list.querySelectorAll('button').forEach(b => b.onclick = () => show(b.dataset.id));
}

function setTab(t, keep) {
  tab = t;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  document.getElementById('cat').innerHTML = FILTERS[t].map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
  if (!keep) { document.getElementById('q').value = ''; show(SET[t][0]?.id); } else renderList();
}

function sources(c) {
  return c.sources.map(s => `${esc(BOOKS[s.book_id] || s.book_id)}: стр. ${s.printed_page ?? '—'} книги (стр. ${s.physical_page ?? '—'} PDF), ${METHOD[s.method] || esc(s.method)}${s.verified ? ' <span class="tag ok">сверено</span>' : ''}`).join('<br>');
}
function corrections(c) {
  const corr = (c.corrections||[]).map(x => `<li><b>${esc(x.field)}</b>: ${x.from ? esc(x.from) + ' → ' : ''}${esc(x.to)} <span class="muted">— ${esc(x.reason)}</span></li>`).join('');
  return corr ? `<section><h3>Исправления</h3><ul>${corr}</ul></section>` : '';
}
function flags(c) {
  const f = (c.quality?.flags||[]).map(x => `<span class="tag warn">${esc(x)}</span>`).join('');
  return f ? `<div>${f} <span class="muted">${esc(c.quality.notes||'')}</span></div>` : '';
}

function statblock(c) {
  const sb = c.statblock || { characteristics: {} };
  const chars = CH.filter(([k]) => sb.characteristics[k]).map(([k, ru]) => {
    const v = sb.characteristics[k];
    return `<div><b>${ru}</b><span>${esc(v.raw)}</span>${v.roll ? `<i>${esc(v.roll)}</i>` : ''}</div>`; }).join('')
    + (sb.luck ? `<div><b>Удача</b><span>${esc(sb.luck.raw)}</span>${sb.luck.note ? `<i>${esc(sb.luck.note)}</i>` : ''}</div>` : '')
    + (sb.sanity ? `<div><b>Рассудок</b><span>${esc(sb.sanity.raw)}</span>${sb.sanity.max != null ? `<i>макс. ${esc(sb.sanity.max)}</i>` : ''}</div>` : '');
  const derived = [['ПЗ', sb.hp], ['ПМ', sb.mp], ['Бонус к урону', sb.damage_bonus], ['Комплекция', sb.build],
    ['Скорость', sb.move], ['Броня', sb.armor], ['Атак за раунд', sb.attacks_per_round]]
    .filter(([, v]) => v && v.raw).map(([k, v]) => {
      // note is shown only when it adds something; parsed notes are usually already inside raw
      const extra = v.note && !v.raw.includes(v.note) ? ` <span class="muted">(${esc(v.note)})</span>` : '';
      return `<tr><th>${k}</th><td>${esc(v.raw)}${extra}</td></tr>`; }).join('');
  const attacks = (sb.attacks||[]).map(a => `<tr><td>${esc(a.name.ru)}${a.kind==='maneuver'?' <span class="tag">манёвр</span>':''}${a.kind==='special'?' <span class="tag">особое</span>':''}</td>
    <td>${esc(a.chance.raw)}</td><td>${a.damage ? esc(a.damage.raw) : '—'}${a.notes ? `<div class="muted">${esc(a.notes)}</div>` : ''}</td></tr>`).join('');
  const san = (sb.sanity_loss||[]).map(s => `<li>${esc(s.success)}/${esc(s.fail)}${s.trigger ? ' — ' + esc(s.trigger) : ''}</li>`).join('');
  const linked = (sb.skills||[]).some(s => s.skill);
  const skills = linked
    ? `<table>${sb.skills.map(s => `<tr><td>${s.skill && byId(s.skill) ? link(s.skill, s.name) : esc(s.name)}</td><td class="num">${esc(s.value.raw)}</td></tr>`).join('')}</table>`
    : (sb.skills||[]).map(s => `${esc(s.name)} ${esc(s.value.raw)}`).join(', ');
  return `<div class="chars">${chars}</div>
    <table>${derived}</table>
    ${c.statblock ? `<section><h3>Бой</h3>
      <table><tr><th>Атака</th><th>Шанс</th><th>Урон</th></tr>${attacks || '<tr><td colspan="3" class="muted">нет данных</td></tr>'}</table>
      ${sb.dodge ? `<div>Уклонение ${esc(sb.dodge.raw)}</div>` : ''}
    </section>` : '<p class="muted">Блока характеристик в книге нет.</p>'}
    ${skills ? `<section><h3>Навыки</h3>${linked ? skills : `<div>${skills}</div>`}</section>` : ''}
    ${sb.spells ? `<section><h3>Заклинания</h3><div>${esc(sb.spells.raw)}</div></section>` : ''}
    ${san ? `<section><h3>Потеря рассудка</h3><ul>${san}</ul></section>` : ''}`;
}

function abilities(c) {
  return (c.abilities||[]).length ? `<section><h3>Способности</h3>${c.abilities.map(a => `<p><b>${esc(a.name)}.</b> ${esc(a.summary)}</p>`).join('')}</section>` : '';
}

function creatureCard(c) {
  return `<h2>${esc(c.name.ru)}</h2>
    <div class="sub">${esc(c.name.en||'')} · ${CAT[c.category]||''}${c.subcategory ? ' · ' + esc(c.subcategory) : ''}${(c.aliases||[]).length ? ' · также: ' + c.aliases.map(esc).join(', ') : ''}</div>
    ${flags(c)}
    ${(c.form_of||[]).length ? `<div>Другая форма: ${c.form_of.map(i => byId(i) ? link(i, byId(i).name.ru) : esc(i)).join(', ')}</div>` : ''}
    ${c.description?.ru ? `<p>${esc(c.description.ru)}</p>` : ''}
    ${c.aura?.ru ? `<section><h3>Аура</h3><p>${esc(c.aura.ru)}</p></section>` : ''}
    ${statblock(c)}
    ${abilities(c)}
    ${c.encounters?.ru ? `<section><h3>Встречи</h3><p>${esc(c.encounters.ru)}</p></section>` : ''}
    ${c.legend?.ru ? `<section><h3>Легенда</h3><p>${esc(c.legend.ru)}</p></section>` : ''}
    ${c.habitat ? `<section><h3>Обитает</h3><p>${esc(c.habitat)}</p></section>` : ''}
    <section><h3>Источник</h3><div>${sources(c)}</div></section>
    ${corrections(c)}`;
}

function characterCard(c) {
  const facts = [['Профессия', c.occupation?.ru], ['Возраст', c.age?.raw], ['Пол', c.sex], ['Место жительства', c.residence], ['Место рождения', c.birthplace],
    ['Типаж', c.stock_type], ['Игрок выбирает', (c.player_chooses||[]).map(x => CHOOSES[x] || x).join(', ')]]
    .filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  const bg = BG.filter(([k]) => c.background?.[k]).map(([k, t]) => `<dt>${t}</dt><dd>${esc(c.background[k])}</dd>`).join('');
  const w = c.wealth || {};
  const wealth = [['Уровень трат', w.spending_level], ['Наличные', w.cash], ['Имущество', w.assets]].filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  return `<h2>${esc(c.name.ru)}</h2>
    <div class="sub">${esc(c.name.en||'')}${(c.roles||[]).map(r => ` <span class="tag">${ROLE[r]}</span>`).join('')}${(c.aliases||[]).length ? ' · также: ' + c.aliases.map(esc).join(', ') : ''}</div>
    ${flags(c)}
    ${facts ? `<dl>${facts}</dl>` : ''}
    ${c.scenario_role ? `<section><h3>Роль в сценарии</h3><p>${esc(c.scenario_role)}</p></section>` : ''}
    ${c.description?.ru ? `<p>${esc(c.description.ru)}</p>` : ''}
    ${statblock(c)}
    ${abilities(c)}
    ${bg ? `<section><h3>Предыстория</h3><dl>${bg}</dl></section>` : ''}
    ${(c.possessions||[]).length ? `<section><h3>Снаряжение</h3><ul>${c.possessions.map(p => `<li>${esc(p)}</li>`).join('')}</ul></section>` : ''}
    ${wealth ? `<section><h3>Деньги</h3><dl>${wealth}</dl></section>` : ''}
    ${c.legend?.ru ? `<section><h3>Легенда</h3><p>${esc(c.legend.ru)}</p></section>` : ''}
    <section><h3>Источник</h3><div>${sources(c)}</div></section>
    ${corrections(c)}`;
}

function skillCard(c) {
  const specs = (c.specializations||[]).map(s => `<tr><td>${esc(s.name.ru)}${s.name.en ? ` <span class="muted">${esc(s.name.en)}</span>` : ''}</td><td class="num">${s.base ? esc(s.base.raw) : '—'}</td></tr>`).join('');
  const users = DATA.characters.flatMap(p => (p.statblock?.skills||[]).filter(s => s.skill === c.id).map(s => [p, s]));
  const used = users.map(([p, s]) => `<tr><td>${link(p.id, p.name.ru)}</td><td>${esc(s.specialization || '')}</td><td class="num">${esc(s.value.raw)}</td></tr>`).join('');
  const era = (c.axes?.era||[]).filter(e => e !== 'any');
  return `<h2>${esc(c.name.ru)}</h2>
    <div class="sub">${esc(c.name.en||'')} · ${esc(c.category)}${c.uncommon ? ' <span class="tag">редкий</span>' : ''}${era.length ? ' · эпоха: ' + era.map(esc).join(', ') : ''}${(c.aliases||[]).length ? ' · также: ' + c.aliases.map(esc).join(', ') : ''}</div>
    ${flags(c)}
    <div class="chars"><div><b>База</b><span>${esc(c.base.raw)}</span></div></div>
    ${c.description?.ru ? `<p>${esc(c.description.ru)}</p>` : ''}
    ${specs ? `<section><h3>Специализации</h3><table><tr><th>Название</th><th>База</th></tr>${specs}</table></section>` : ''}
    ${(c.examples||[]).length ? `<section><h3>Примеры</h3><ul>${c.examples.map(e => `<li>${esc(e)}</li>`).join('')}</ul></section>` : ''}
    ${used ? `<section><h3>У персонажей</h3><table><tr><th>Персонаж</th><th>Специализация</th><th>Значение</th></tr>${used}</table></section>` : ''}
    <section><h3>Источник</h3><div>${sources(c)}</div></section>
    ${corrections(c)}`;
}

function show(id) {
  const c = id && byId(id);
  if (!c) { document.getElementById('card').innerHTML = '<p class="muted">Нет записей.</p>'; renderList(); return; }
  if (c.kind !== tab) setTab(c.kind, true);
  current = id; renderList();
  const card = document.getElementById('card');
  card.innerHTML = c.kind === 'creature' ? creatureCard(c) : c.kind === 'character' ? characterCard(c) : skillCard(c);
  card.querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); show(a.dataset.go); });
  history.replaceState(null, '', '#' + encodeURIComponent(c.kind + '/' + id.split(/[:/]/).pop()));
  window.scrollTo(0, 0);
}

document.getElementById('q').oninput = renderList;
document.getElementById('cat').onchange = renderList;
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
Object.values(SET).forEach(s => s.sort((a, b) => a.name.ru.localeCompare(b.name.ru, 'ru')));
const [hk, hs] = decodeURIComponent(location.hash.slice(1)).split('/');
const start = hs && SET[hk] ? SET[hk].find(c => c.id.split(/[:/]/).pop() === hs) : null;
setTab(start ? start.kind : (SET[hk] ? hk : 'creature'), true);
show(start ? start.id : SET[tab][0]?.id);
</script>
</body>
</html>

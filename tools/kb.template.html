<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База знаний CoC</title>
<style>
:root { --bg:#f7f5f0; --panel:#fff; --ink:#1e1d1a; --muted:#6b675e; --line:#ddd8cc; --accent:#6d3b2a; --warn:#a15c00; --ok:#2f6b3a; }
@media (prefers-color-scheme: dark) { :root { --bg:#16150f; --panel:#201f19; --ink:#ece8dd; --muted:#a39e91; --line:#3a382f; --accent:#d59a7e; --warn:#e3a64a; --ok:#7cc48a; } }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
header h1 { font-size:18px; margin:0 8px 0 0; }
.tabs { display:flex; gap:4px; }
.tabs button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:none; color:inherit; cursor:pointer; }
.tabs button.active { background:var(--panel); border-color:var(--accent); color:var(--accent); font-weight:600; }
input, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); }
main { display:grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 58px); }
#list { border-right:1px solid var(--line); overflow:auto; max-height: calc(100vh - 58px); }
#list button { display:block; width:100%; text-align:left; padding:8px 16px; border:0; border-bottom:1px solid var(--line); background:none; color:inherit; font:inherit; cursor:pointer; }
#list button:hover, #list button.active { background:var(--panel); }
#list small { color:var(--muted); display:block; }
details { border:1px solid var(--line); border-radius:6px; padding:4px 10px; margin:6px 0; }
summary { cursor:pointer; font-weight:600; }
#list h4 { margin:0; padding:10px 16px 4px; font-size:12px; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--line); }
#card { padding:16px 24px; max-width: 900px; min-width:0; }
h2 { margin:0 0 4px; font-size:24px; }
.sub { color:var(--muted); margin-bottom:12px; }
.chars { display:grid; grid-template-columns: repeat(auto-fill, minmax(90px,1fr)); gap:6px; margin:12px 0; }
.chars div { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
.chars b { display:block; font-size:12px; color:var(--muted); font-weight:600; }
.chars span { font-size:18px; font-variant-numeric: tabular-nums; }
.chars i { display:block; font-size:11px; color:var(--muted); font-style:normal; }
table { border-collapse: collapse; width:100%; margin:8px 0; }
td, th { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:13px; }
td.num { font-variant-numeric: tabular-nums; white-space:nowrap; }
section { margin:18px 0; }
section h3 { font-size:15px; margin:0 0 6px; color:var(--accent); text-transform: uppercase; letter-spacing:.04em; }
dl { display:grid; grid-template-columns: max-content 1fr; gap:4px 12px; margin:0; }
dt { color:var(--muted); }
dd { margin:0; }
a { color:var(--accent); }
.tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; border:1px solid var(--line); margin-right:4px; }
.tag.warn { color:var(--warn); border-color:var(--warn); }
.tag.ok { color:var(--ok); border-color:var(--ok); }
.muted { color:var(--muted); }
@media (max-width: 760px) { main { grid-template-columns: 1fr; } #list { max-height: 40vh; border-right:0; border-bottom:1px solid var(--line); } #card { padding:16px; } }
</style>
</head>
<body>
<header>
  <h1>База знаний</h1>
  <div class="tabs" role="tablist">
    <button data-tab="creature">Существа</button>
    <button data-tab="character">Персонажи</button>
    <button data-tab="skill">Навыки</button>
    <button data-tab="occupation">Профессии</button>
    <button data-tab="spell">Заклинания</button>
    <button data-tab="tome">Книги</button>
    <button data-tab="weapon">Оружие</button>
  </div>
  <input id="q" type="search" placeholder="Поиск по имени" aria-label="Поиск">
  <select id="cat" aria-label="Фильтр"></select>
  <select id="occ" aria-label="Профессия" hidden></select>
  <select id="mech" aria-label="Механика" hidden><option value="">Все механики</option><option value="мгновенное">Мгновенные</option><option value="поддерживаемое">Поддерживаемые</option><option value="ритуал">Ритуалы</option></select>
  <select id="era" aria-label="Эпоха" hidden><option value="">Все эпохи</option><option value="1920s">1920-е</option><option value="modern">Современность</option></select>
  <span id="count" class="muted"></span>
</header>
<main>
  <nav id="list"></nav>
  <article id="card"></article>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const CAT = { animal:'Зверь', mythos_monster:'Тварь Мифов', mythos_deity:'Божество Мифов', avatar:'Воплощение', supernatural:'Сверхъестественное' };
const ROLE = { npc:'NPC', pregen:'преген' };
const CH = [['STR','СИЛ'],['CON','ВЫН'],['SIZ','ТЕЛ'],['DEX','ЛВК'],['APP','НАР'],['INT','ИНТ'],['POW','МОЩ'],['EDU','ОБР']];
const BOOKS = { 'investigator-handbook-ru': 'Книга сыщика', 'curious-characters-deck-en': 'Curious Characters Deck', 'keeper-rulebook-ru': 'Книга хранителя', 'keeper-rulebook-en': 'Keeper Rulebook (англ.)', 'grand-grimoire-en': 'Grand Grimoire of Cthulhu Mythos Magic', 'masks-of-nyarlathotep-en': 'Masks of Nyarlathotep (7e)', 'web-helper-coc': 'веб-помощник', 'weapons-catalog-1920s': 'каталог оружия 1920-х (пользовательский, не книга)', 'lightless-beacon-ru': 'Погасший маяк', 'malleus-keeper-deck-en': 'Malleus Keeper Deck', 'malleus-monstrorum-1-en': 'Malleus Monstrorum, т. I', 'malleus-monstrorum-2-en': 'Malleus Monstrorum, т. II', 'digital-nightmares-pregens-ru': 'Кошмары цифровой эпохи: готовые персонажи', 'dveri-vo-tmu-pregens-ru': 'Двери во тьму: готовые персонажи', 'koshmarnyy-priliv-pregens-ru': 'Кошмарный прилив: готовые персонажи', 'naedine-s-tmoy-pregens-ru': 'Наедине с тьмой: готовые персонажи', 'startovyy-nabor-pregens-ru': 'Стартовый набор: готовые персонажи', 'mertvennyy-svet-pregens-ru': 'Мертвенный свет: готовые персонажи', 'kholodnyy-urozhay-pregens-ru': 'Холодный урожай: готовые персонажи', 'nabor-khranitelya-pregens-ru': 'Набор хранителя: готовые персонажи', 'les-vendigo-pregens-ru': 'Лес Вендиго: готовые персонажи', 'za-zakrytymi-dveryami-pregens-ru': 'За закрытыми дверьми: готовые персонажи' };
const METHOD = { book_text: 'сверено с книгой', helper_migration: 'перенесено из веб-помощника', mineru: 'извлечено MinerU', manual: 'введено вручную' };
const CHOOSES = { name:'имя', sex:'пол', age:'возраст', luck:'Удача', skills:'навыки', background:'предыстория' };
const BG = [['description','Описание'],['ideology','Убеждения'],['significant_people','Значимые люди'],['meaningful_locations','Значимые места'],
  ['treasured_possessions','Ценности'],['traits','Черты'],['injuries','Травмы и шрамы'],['phobias_manias','Фобии и мании'],['arcane_tomes','Тайные знания'],['encounters','Встречи со странными сущностями'],['secret','Тайна']];
const FILTERS = {
  creature: [['', 'Все категории'], ...Object.entries(CAT)],
  character: [['', 'Все персонажи'], ['role:npc', 'NPC'], ['era:1920s', 'Эпоха: 1920-е'], ['era:modern', 'Эпоха: современность'],
    ...[...new Set(DATA.characters.map(c => c.sources?.[0]?.book_id))].filter(Boolean).sort().map(b => ['book:' + b, (BOOKS[b] || b).replace(': готовые персонажи', '')])],
  occupation: [['', 'Все профессии'], ['lovecraftian', 'Лавкрафтовские'], ['era:1920s', 'Эпоха: 1920-е'], ['era:modern', 'Эпоха: современность']],
  skill: [['', 'Все категории'], ...[...new Set(DATA.skills.map(s => s.category))].sort().map(c => [c, c])],
  spell: [['', 'Все типы'], ['family', 'Только общие (семейства)'], ...[...new Set(DATA.spells.map(s => s.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru')).map(c => [c, c])],
};
FILTERS.tome = [['', 'Все книги'], ['mythos_tome', 'Книги Мифов'], ['occult_book', 'Оккультные книги'], ['general', 'Только общие записи'],
  ...[...new Set(DATA.tomes.map(t => t.language).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru')).map(l => ['lang:' + l, 'Язык: ' + l])];
const WGROUP = { melee: 'Ближний бой', handgun: 'Пистолеты и револьверы', rifle: 'Винтовки', shotgun: 'Дробовики', automatic: 'Автоматическое оружие', heavy: 'Тяжёлое оружие и взрывчатка', other: 'Прочее' };
// weapon filters: type here, era in its own select (#era)
FILTERS.weapon = [['', 'Все типы'], ...Object.entries(WGROUP)];
const SET = { creature: DATA.creatures, character: DATA.characters, skill: DATA.skills, occupation: DATA.occupations, spell: DATA.spells, tome: DATA.tomes, weapon: DATA.weapons };
const ALL = [...DATA.creatures, ...DATA.characters, ...DATA.skills, ...DATA.occupations, ...DATA.spells, ...DATA.tomes, ...DATA.weapons];
const TOME_TYPE = { mythos_tome: 'книга Мифов', occult_book: 'оккультная книга' };
const byId = id => ALL.find(x => x.id === id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bookOf = c => c.sources?.[0]?.book_id;
const kindOf = c => c.kind;
const link = (id, text) => `<a href="#" data-go="${esc(id)}">${esc(text)}</a>`;
let tab = 'creature', current = null;

const occOf = c => c.occupation_ref ? c.occupation_ref : (c.occupation?.ru || '').trim().toLowerCase();
const nameHit = (c, q) => [c.name.ru, c.name.en, ...(c.aliases||[]), c.occupation?.ru].some(n => (n||'').toLowerCase().includes(q));
function matches(c, q, f) {
  if (q && !nameHit(c, q)) return false;
  const o = document.getElementById('occ').value;
  if (tab === 'character' && o && occOf(c) !== o) return false;
  const mech = document.getElementById('mech').value;
  if (tab === 'spell' && mech && c.mechanic !== mech) return false;
  if (tab === 'weapon') {
    const e = document.getElementById('era').value;
    if (e && !(c.axes?.era||[]).some(x => x === e || x === 'any')) return false;
    return !f || c.group === f;
  }
  if (!f) return true;
  if (tab === 'creature') return c.category === f;
  if (tab === 'character') { const [k, v] = f.split(':'); return k === 'role' ? (c.roles||[]).includes(v) : k === 'era' ? (c.axes?.era||[]).includes(v) : bookOf(c) === v; }
  if (tab === 'occupation') return f === 'lovecraftian' ? c.lovecraftian : (c.axes?.era||[]).includes(f.split(':')[1]);
  if (tab === 'spell' && f === 'family') return DATA.spells.some(s => s.variant_of === c.id);
  if (tab === 'tome') return f === 'general' ? DATA.tomes.some(t => t.edition_of === c.id) : f.startsWith('lang:') ? c.language === f.slice(5) : c.tome_type === f;
  return c.category === f;
}

// every firearm has a calibre (Р-63); melee, thrown and explosives show «—»
const caliberOf = c => c.caliber || '—';
function subtitle(c) {
  if (c.kind === 'creature') return `${esc(c.name.en||'')} · ${CAT[c.category]||''}${bookOf(c) !== 'keeper-rulebook-ru' ? ' · ' + esc(BOOKS[bookOf(c)] || bookOf(c)) : ''}`;
  if (c.kind === 'character') return [c.occupation?.ru, ...(c.roles||[]).map(r => ROLE[r])].filter(Boolean).map(esc).join(' · ');
  if (c.kind === 'spell') return [c.category, c.mechanic].filter(Boolean).map(esc).join(' · ');
  if (c.kind === 'weapon') return [caliberOf(c), WGROUP[c.group]].filter(Boolean).map(esc).join(' · ');
  if (c.kind === 'tome') return [c.name.en, c.language].filter(Boolean).map(esc).join(' · ');
  if (c.kind === 'occupation') return `Средства ${esc(c.credit_rating.raw)}${c.lovecraftian ? ' · лавкрафтовская' : ''}${c.group ? ' · ' + esc(c.group) : ''}`;
  return `${esc(c.name.en||'')} · ${c.base.raw === '—' ? esc(c.category) : 'база ' + esc(c.base.raw)}`;
}

const TAB_RU = Object.fromEntries([...document.querySelectorAll('.tabs button')].map(b => [b.dataset.tab, b.textContent]));
const item = c => `<button data-id="${esc(c.id)}" class="${c.id===current?'active':''}">${esc(c.name.ru)}
    ${(c.quality?.flags||[]).filter(x => x !== 'translated').length ? '<span class="tag warn">!</span>' : ''}<small>${subtitle(c)}</small></button>`;
function renderList() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const f = document.getElementById('cat').value;
  const list = document.getElementById('list');
  // a query searches every tab: results grouped by tab, current tab first; tab filters do not apply
  document.getElementById('cat').disabled = document.getElementById('occ').disabled = document.getElementById('era').disabled = document.getElementById('mech').disabled = !!q;
  if (q) {
    const kinds = [tab, ...Object.keys(SET).filter(k => k !== tab)];
    const groups = kinds.map(k => [k, SET[k].filter(c => nameHit(c, q))]).filter(([, xs]) => xs.length);
    const n = groups.reduce((s, [, xs]) => s + xs.length, 0);
    document.getElementById('count').textContent = n + ' во всех вкладках';
    list.innerHTML = groups.map(([k, xs]) => `<h4>${esc(TAB_RU[k])} (${xs.length})</h4>${xs.map(item).join('')}`).join('') || '<p class="muted" style="padding:8px 16px">Ничего не найдено.</p>';
  } else {
    const set = SET[tab];
    const items = set.filter(c => matches(c, q, f));
    document.getElementById('count').textContent = items.length + ' из ' + set.length;
    list.innerHTML = items.map(item).join('');
  }
  list.querySelectorAll('button').forEach(b => b.onclick = () => show(b.dataset.id));
}

function setTab(t, keep) {
  tab = t;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  document.getElementById('cat').innerHTML = FILTERS[t].map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
  const occ = document.getElementById('occ'); occ.hidden = t !== 'character';
  document.getElementById('era').hidden = t !== 'weapon';
  document.getElementById('mech').hidden = t !== 'spell';
  if (t === 'character') {
    const counts = {};
    const label = {};
    DATA.characters.forEach(c => { const o = occOf(c); if (o) { counts[o] = (counts[o] || 0) + 1; label[o] = label[o] || (c.occupation_ref && byId(c.occupation_ref) ? byId(c.occupation_ref).name.ru : c.occupation.ru.trim()); } });
    occ.innerHTML = '<option value="">Все профессии</option>' + Object.keys(counts).sort((a, b) => a.localeCompare(b, 'ru'))
      .map(o => `<option value="${esc(o)}">${esc(label[o].charAt(0).toUpperCase() + label[o].slice(1))} (${counts[o]})</option>`).join('');
  }
  if (!keep) { document.getElementById('q').value = ''; show(SET[t][0]?.id); } else renderList();
}

function sources(c) {
  return c.sources.map(s => `${esc(BOOKS[s.book_id] || s.book_id)}: стр. ${s.printed_page ?? '—'} книги (стр. ${s.physical_page ?? '—'} PDF)${s.entry_page ? `, статья начинается на стр. ${esc(s.entry_page)} PDF` : ''}, ${METHOD[s.method] || esc(s.method)}${s.verified ? ' <span class="tag ok">сверено</span>' : ''}${s.note ? ` <span class="muted">— ${esc(s.note)}</span>` : ''}`).join('<br>');
}
function errata(c) {
  const e = (c.errata||[]).map(x => `<li><b>${esc(x.field)}</b>: ${x.printed ? 'напечатано ' + esc(x.printed) : ''}${x.expected ? ', ожидалось ' + esc(x.expected) : ''}${x.printed || x.expected ? ' — ' : ''}${esc(x.note)} <span class="tag ${x.fixed ? 'ok' : ''}">${x.fixed ? 'исправлено в записи' : 'оставлено как напечатано'}</span></li>`).join('');
  return e ? `<section><h3>Опечатки книги</h3><ul>${e}</ul></section>` : '';
}
function corrections(c) {
  const corr = (c.corrections||[]).map(x => `<li><b>${esc(x.field)}</b>: ${x.from ? esc(x.from) + ' → ' : ''}${esc(x.to)} <span class="muted">— ${esc(x.reason)}</span></li>`).join('');
  return corr ? `<section><h3>Исправления</h3><ul>${corr}</ul></section>` : '';
}
const FLAG = {
  translated: ['перевод', 'Русский текст — наш перевод с английского (Р-21).'],
  parse_uncertain: ['опечатка книги', 'В книге опечатка или противоречие; значение оставлено как напечатано, см. «Опечатки книги».'],
  incomplete: ['неполно', 'В книге нет части данных (характеристик, процента атаки и т. п.).'],
  ocr_suspect: ['распознавание', 'Текст получен распознаванием и может содержать ошибки.'],
  editorial_text: ['текст редакции', 'Текст не из книги, а написан при переносе.'],
};
function flags(c) {
  const q = c.quality || {};
  const f = (q.flags||[]).map(x => { const [label, tip] = FLAG[x] || [x, '']; return `<span class="tag ${x === 'translated' ? '' : 'warn'}" title="${esc(tip)}">${esc(label)}</span>`; }).join('')
    + (q.needs_review ? '<span class="tag warn" title="Запись требует проверки.">на проверку</span>' : '');
  return f || q.notes ? `<div>${f} <span class="muted">${esc(q.notes||'')}</span></div>` : '';
}

function statblock(c) {
  const sb = c.statblock || { characteristics: {} };
  const chars = CH.filter(([k]) => sb.characteristics[k]).map(([k, ru]) => {
    const v = sb.characteristics[k];
    return `<div><b>${ru}</b><span>${esc(v.raw)}</span>${v.roll ? `<i>${esc(v.roll)}</i>` : ''}</div>`; }).join('')
    + (sb.luck ? `<div><b>Удача</b><span>${esc(sb.luck.raw)}</span>${sb.luck.note ? `<i>${esc(sb.luck.note)}</i>` : ''}</div>` : '')
    + (sb.sanity ? `<div><b>Рассудок</b><span>${esc(sb.sanity.raw)}</span>${sb.sanity.max != null ? `<i>макс. ${esc(sb.sanity.max)}</i>` : ''}</div>` : '');
  const derived = [['ПЗ', sb.hp], ['ПМ', sb.mp], ['Бонус к урону', sb.damage_bonus], ['Комплекция', sb.build],
    ['Скорость', sb.move], ['Броня', sb.armor], ['Атак за раунд', sb.attacks_per_round]]
    .filter(([, v]) => v && v.raw).map(([k, v]) => {
      // note is shown only when it adds something; parsed notes are usually already inside raw
      const extra = v.note && !v.raw.includes(v.note) ? ` <span class="muted">(${esc(v.note)})</span>` : '';
      return `<tr><th>${k}</th><td>${esc(v.raw)}${extra}</td></tr>`; }).join('');
  const attacks = (sb.attacks||[]).map(a => `<tr><td>${a.weapon && byId(a.weapon) ? link(a.weapon, a.name.ru) : esc(a.name.ru)}${a.kind==='maneuver'?' <span class="tag">манёвр</span>':''}${a.kind==='special'?' <span class="tag">особое</span>':''}</td>
    <td>${esc(a.chance.raw)}</td><td>${a.damage ? esc(a.damage.raw) : '—'}${a.notes ? `<div class="muted">${esc(a.notes)}</div>` : ''}</td></tr>`).join('');
  const san = (sb.sanity_loss||[]).map(s => `<li>${esc(s.success)}/${esc(s.fail)}${s.trigger ? ' — ' + esc(s.trigger) : ''}</li>`).join('');
  const linked = (sb.skills||[]).some(s => s.skill);
  const skills = linked
    ? `<table>${sb.skills.map(s => `<tr><td>${s.skill && byId(s.skill) ? link(s.skill, s.name) : esc(s.name)}</td><td class="num">${esc(s.value.raw)}</td></tr>`).join('')}</table>`
    : (sb.skills||[]).map(s => `${esc(s.name)} ${esc(s.value.raw)}`).join(', ');
  return `<div class="chars">${chars}</div>
    <table>${derived}</table>
    ${c.statblock ? `<section><h3>Бой</h3>
      <table><tr><th>Атака</th><th>Шанс</th><th>Урон</th></tr>${attacks || '<tr><td colspan="3" class="muted">нет данных</td></tr>'}</table>
      ${sb.dodge ? `<div>Уклонение ${esc(sb.dodge.raw)}</div>` : ''}
    </section>` : '<p class="muted">Блока характеристик в книге нет.</p>'}
    ${skills ? `<section><h3>Навыки</h3>${linked ? skills : `<div>${skills}</div>`}</section>` : ''}
    ${sb.spells ? `<section><h3>Заклинания</h3><div>${spellsText(sb.spells)}</div></section>` : ''}
    ${san ? `<section><h3>Потеря рассудка</h3><ul>${san}</ul></section>` : ''}`;
}

// printed spell list with each recognised name turned into a link (statblock.spells.items, Р-52)

const REL = {

  rival_of: ['Недруги', null],
  works_for: ['Работает на', 'На него работают'],
  variant_of: ['Вариант прегена', 'Другие варианты'],

function relLinks(items) {
  return items.map(([id, note]) => (byId(id) ? link(id, byId(id).name.ru) : esc(id)) + (note ? ` <span class="muted">(${esc(note)})</span>` : '')).join(', ');

function relations(c) {
  const rows = [];
  for (const [type, [fwd, rev]] of Object.entries(REL)) {
    const out = (c.relations||[]).filter(r => r.type === type).map(r => [r.target, r.note]);
    const inc = ALL.flatMap(x => (x.relations||[]).filter(r => r.type === type && r.target === c.id).map(r => [x.id, r.note_back ?? (['relative_of', 'knows', 'rival_of', 'works_for', 'variant_of'].includes(type) ? null : r.note)]));
    if (rev === null) {
      // symmetric relation: both directions in one row, without duplicates
      const all = [...out, ...inc.filter(([id]) => !out.some(([o]) => o === id))];
      if (all.length) rows.push(`<dt>${fwd}</dt><dd>${relLinks(all)}</dd>`);
      continue;
    }
    if (out.length) rows.push(`<dt>${fwd}</dt><dd>${relLinks(out)}</dd>`);
    if (inc.length) rows.push(`<dt>${rev}</dt><dd>${relLinks(inc)}</dd>`);

  const same = (c.same_as||[]).filter(byId);
  if (same.length) rows.push(`<dt>То же существо</dt><dd>${refLinks(same)}</dd>`);

// how: 'push' — new history entry (clicks, tab switch), 'replace' — first load, 'none' — back/forward
function show(id, how = 'push') {
  const c = id && byId(id);
  if (!c) { document.getElementById('card').innerHTML = '<p class="muted">Нет записей.</p>'; renderList(); return; }
  if (c.kind !== tab) setTab(c.kind, true);
  current = id; renderList();
  const card = document.getElementById('card');
  card.innerHTML = c.kind === 'creature' ? creatureCard(c) : c.kind === 'character' ? characterCard(c) : c.kind === 'occupation' ? occupationCard(c) : c.kind === 'spell' ? spellCard(c) : c.kind === 'tome' ? tomeCard(c) : c.kind === 'weapon' ? weaponCard(c) : skillCard(c);
  card.querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); show(a.dataset.go); });
  const hash = '#' + encodeURIComponent(c.kind + '/' + id.split(/[:/]/).pop());
  if (how === 'replace') history.replaceState(null, '', hash);
  else if (how === 'push' && location.hash !== hash) history.pushState(null, '', hash);
  window.scrollTo(0, 0);
}

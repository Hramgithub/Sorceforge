<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База знаний CoC</title>
<style>
:root { --bg:#f7f5f0; --panel:#fff; --ink:#1e1d1a; --muted:#6b675e; --line:#ddd8cc; --accent:#6d3b2a; --warn:#a15c00; --ok:#2f6b3a; }
@media (prefers-color-scheme: dark) { :root { --bg:#16150f; --panel:#201f19; --ink:#ece8dd; --muted:#a39e91; --line:#3a382f; --accent:#d59a7e; --warn:#e3a64a; --ok:#7cc48a; } }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
header h1 { font-size:18px; margin:0 8px 0 0; }
.tabs { display:flex; gap:4px; flex-wrap:wrap; min-width:0; }
.tabs button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:none; color:inherit; cursor:pointer; }
.tabs button.active { background:var(--panel); border-color:var(--accent); color:var(--accent); font-weight:600; }
header #q { margin-left:auto; width:220px; max-width:100%; }
.who { display:flex; gap:8px; align-items:center; white-space:nowrap; }
.who[hidden] { display:none; }
.who button { font:inherit; padding:6px 12px; border:1px solid var(--accent); border-radius:6px; background:none; color:var(--accent); cursor:pointer; }
input, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); }
main { display:grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 58px); }
#list { border-right:1px solid var(--line); overflow:auto; max-height: calc(100vh - 58px); }
#list button { display:block; width:100%; text-align:left; padding:8px 16px; border:0; border-bottom:1px solid var(--line); background:none; color:inherit; font:inherit; cursor:pointer; }
#list button:hover, #list button.active { background:var(--panel); }
#list small { color:var(--muted); display:block; }
#subbar { padding:8px 16px; border-bottom:1px solid var(--line); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
#subbtns, #filters { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
#subbtns:empty { display:none; }
/* a line between the tab's buttons and the filters, only when there are buttons */
#subbtns:not(:empty) + #filters { border-left:1px solid var(--line); padding-left:12px; margin-left:6px; }
#filters [hidden] { display:none; }
/* no visible filter and no count (the guides): no empty block and no dividing line */
#filters:not(:has(> select:not([hidden]), > #count:not(:empty))) { display:none; }
.gcity { margin:10px 0 14px; }
.gcity h4 { margin:0 0 4px; font-size:16px; }
.gcity p { margin:2px 0; }
#filters select { max-width:260px; }
blockquote.handout { margin:0; padding:10px 16px; border-left:3px solid var(--accent); background:var(--panel); font-family:Georgia, "Times New Roman", serif; }
#subbar button { font:inherit; padding:4px 10px; border:1px solid var(--line); border-radius:6px; background:none; color:inherit; cursor:pointer; }
#subbar button.active { background:var(--panel); border-color:var(--accent); color:var(--accent); font-weight:600; }
#subbar select { padding:4px 8px; border-color:var(--accent); color:var(--accent); font-weight:600; cursor:pointer; }
#subbar .sep { width:1px; align-self:stretch; background:var(--line); margin:0 6px; }
/* left panel trees (Р-137): each level is indented past its parent's name, and the type gets smaller with
   depth — 16px for the city, then 15, 14, 13, 12; headings of groups differ by colour, not by size */
#list h4.dist { cursor:pointer; text-transform:none; letter-spacing:0; font-size:16px; color:var(--ink); }
#list h4.dist.active { background:var(--panel); }
#list h4.dist.sub { padding-left:28px; font-weight:500; font-size:15px; }
#list button.house { padding-left:32px; font-size:14px; }
#list button.househ { padding:6px 16px 4px 32px; color:var(--accent); font-size:14px; font-weight:600; }
#list button.person { padding-left:44px; font-size:13px; }
#list button.house.room { padding-left:72px; font-size:13px; }
#list h4.dist.sub.deep { padding-left:48px; font-size:14px; }
#list button.rec { padding:6px 16px 6px 32px; font-size:14px; }
#list button.rec.l1 { padding-left:72px; font-size:13px; }
#list button.rec.l2 { padding-left:92px; font-size:12px; }
/* a row that folds (part of the book, «Хранителю», type of records) reads like the scenario row above it:
   same colour, medium weight; what it holds starts past its name */
#list .part { padding:8px 16px 6px 16px; font-size:15px; font-weight:500; border-bottom:1px solid var(--line); }
#list .part[data-part] { cursor:pointer; }
#list .part[data-part]:hover { background:var(--panel); }
#list .part.l1 { padding-left:48px; font-size:14px; }
#list .part.l2 { padding-left:68px; font-size:13px; }
#list h4.dist.sub.tochead { padding-left:48px; font-size:14px; }
#list h4.dist.sub.tochead.deep { padding-left:68px; font-size:13px; }
#list .toc button { padding:5px 16px 5px 32px; font-size:15px; }
#list .toc.l1 button { padding-left:72px; font-size:13px; }
#list .toc.l2 button { padding-left:92px; font-size:12px; }
#list h4[data-back] small { display:block; font-weight:400; }
#list .fold { display:inline-block; width:1.4em; margin-left:-.3em; text-align:center; cursor:pointer; }
#list .fold:hover { color:var(--accent); }
#list .mapicon { float:right; display:inline-flex; padding:3px 5px; margin:-3px -6px 0 6px; border-radius:4px; color:var(--muted); cursor:pointer; }
#list .mapicon:hover { color:var(--accent); background:var(--bg); outline:1px solid var(--accent); }
details { border:1px solid var(--line); border-radius:6px; padding:4px 10px; margin:6px 0; }
summary { cursor:pointer; font-weight:600; }
#list h4 { margin:0; padding:10px 16px 4px; font-size:12px; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--line); }
#card { padding:16px 24px; max-width: 900px; min-width:0; }
h2 { margin:0 0 4px; font-size:24px; }
.sub { color:var(--muted); margin-bottom:12px; }
.chars { display:grid; grid-template-columns: repeat(auto-fill, minmax(90px,1fr)); gap:6px; margin:12px 0; }
.chars div { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
.chars b { display:block; font-size:12px; color:var(--muted); font-weight:600; }
.chars span { font-size:18px; font-variant-numeric: tabular-nums; }
.chars i { display:block; font-size:11px; color:var(--muted); font-style:normal; }
table { border-collapse: collapse; width:100%; margin:8px 0; }
td, th { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:13px; }
td.num { font-variant-numeric: tabular-nums; white-space:nowrap; }
section { margin:18px 0; }
section h3 { font-size:15px; margin:0 0 6px; color:var(--accent); text-transform: uppercase; letter-spacing:.04em; }
dl { display:grid; grid-template-columns: max-content 1fr; gap:4px 12px; margin:0; }
dt { color:var(--muted); }
dd { margin:0; }
a { color:var(--accent); }
.tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; border:1px solid var(--line); margin-right:4px; }
.tag.warn { color:var(--warn); border-color:var(--warn); }
.tag.ok { color:var(--ok); border-color:var(--ok); }
.muted { color:var(--muted); }
/* maps (Р-120): the book image keeps its own colours, so spot colours are fixed */
#card.wide { max-width:none; }
.maptools { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:8px 0; }
.maptools button { font:inherit; padding:4px 10px; border:1px solid var(--line); border-radius:6px; background:none; color:inherit; cursor:pointer; }
.maptools .mapname { color:var(--accent); font-size:16px; margin-right:4px; }
.maptools #mapq { width:180px; }
.maptools label { white-space:nowrap; }
.maptools .sep { width:1px; align-self:stretch; background:var(--line); margin:0 4px; }
.mapbox { position:relative; overflow:auto; max-height:calc(100vh - 200px); border:1px solid var(--line); border-radius:6px; background:#f6efcf; cursor:grab; }
.mapbox.drag { cursor:grabbing; }
.mapinner { position:relative; margin:0 auto; }
.mapinner img { display:block; width:100%; height:100%; user-select:none; -webkit-user-drag:none; }
.spot { position:absolute; transform:translate(-50%,-50%); padding:0; border:2px solid transparent; border-radius:50%; background:transparent; cursor:pointer; }
.spot.label { border-radius:4px; }
.spot:hover, .spot:focus-visible { border-color:#6d3b2a; background:rgba(109,59,42,.2); outline:none; }
.spot.doubt { border:2px dashed rgba(161,92,0,.75); }
.spot.hit { border:3px solid #1f6feb; background:rgba(31,111,235,.2); }
/* a place the map does not mark (position worked out from the address): drawn by the viewer */
.spot.computed { border:3px dashed #c0392b; background:rgba(192,57,43,.25); }
.spot.lit { border:3px solid #e67e22; background:rgba(230,126,34,.35); box-shadow:0 0 0 4px rgba(230,126,34,.35); }
.spot.litd { border:3px solid #1f6feb; background:rgba(31,111,235,.35); box-shadow:0 0 0 4px rgba(31,111,235,.3); }
.spot.litz { border:3px solid #0aa5c0; background:rgba(10,165,192,.35); box-shadow:0 0 0 4px rgba(10,165,192,.3); }
.spot.focus { border:3px solid #c0392b; background:rgba(192,57,43,.15); animation:spotpulse 1.4s ease-in-out 5; }
@keyframes spotpulse { 50% { box-shadow:0 0 0 12px rgba(192,57,43,.35); } }
.mapinner.edit .spot { border:2px solid rgba(31,111,235,.7); cursor:move; }
/* «Жители»: places without residents are veiled; a dot per resident (people teal, creatures purple) */
.mapinner.res .spot.nores { background:rgba(246,239,207,.75); }
.rdot { position:absolute; transform:translate(-50%,-50%); aspect-ratio:1; min-width:9px; padding:0; border:2px solid #fff; border-radius:50%; background:#1f8a7a; box-shadow:0 0 0 1px rgba(0,0,0,.45); cursor:pointer; }
.rdot.creature { background:#8e44ad; }
.rdot:hover, .rdot.lit { background:#e67e22; transform:translate(-50%,-50%) scale(1.35); z-index:2; }
.rdot.hit { background:#1f6feb; transform:translate(-50%,-50%) scale(1.35); }
.mapinner.edit .rdot { pointer-events:none; opacity:.4; }
.spot.new { border:2px solid #1f6feb; background:rgba(31,111,235,.4); width:12px; height:12px; pointer-events:none; }
.maptip { position:fixed; z-index:10; max-width:340px; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.25); pointer-events:none; }
.maptip .warnt { color:var(--warn); }
#mapedit-panel textarea { width:100%; min-height:90px; font:12px/1.4 ui-monospace, monospace; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; }
@media (max-width: 760px) { main { grid-template-columns: 1fr; } #list { max-height: 40vh; border-right:0; border-bottom:1px solid var(--line); } #card { padding:16px; } }
</style>
</head>
<body>
<header>
  <h1>База знаний</h1>
  <div class="tabs" role="tablist">
    <button data-tab="creature">Существа</button>
    <button data-tab="character">Персонажи</button>
    <button data-tab="skill">Навыки</button>
    <button data-tab="occupation">Профессии</button>
    <button data-tab="spell">Заклинания</button>
    <button data-tab="weapon">Оружие</button>
    <button data-tab="location">Гайды</button>
  </div>
  <!-- search is the same on every tab, so it lives in the top row; the second row keeps the tab's own buttons and filters -->
  <input id="q" type="search" placeholder="Поиск по имени" aria-label="Поиск">
  <div id="who" class="who" hidden><span class="muted">Вы вошли как</span> <b id="who-name"></b> <button id="logout" type="button">Выйти</button></div>
</header>
<!-- second row on every tab: the tab's own buttons (spells/books, guides/sections), then filters and the count -->
<nav id="subbar"><span id="subbtns"></span><span id="filters">
  <select id="cat" aria-label="Фильтр"></select>
  <select id="occ" aria-label="Профессия" hidden></select>
  <select id="mech" aria-label="Механика" hidden><option value="">Все механики</option><option value="мгновенное">Мгновенные</option><option value="поддерживаемое">Поддерживаемые</option><option value="ритуал">Ритуалы</option></select>
  <select id="era" aria-label="Эпоха" hidden><option value="">Все эпохи</option><option value="1920s">1920-е</option><option value="modern">Современность</option></select>
  <span id="count" class="muted"></span>
</span></nav>
<main>
  <nav id="list"></nav>
  <article id="card"></article>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
// the page sets its own scroll on every card (top, or the map view); the browser must not restore an old one on «Назад»
history.scrollRestoration = 'manual';
const CAT = { animal:'Зверь', mythos_monster:'Тварь Мифов', mythos_deity:'Божество Мифов', avatar:'Воплощение', supernatural:'Сверхъестественное' };
const ROLE = { npc:'NPC', pregen:'преген' };
const CH = [['STR','СИЛ'],['CON','ВЫН'],['SIZ','ТЕЛ'],['DEX','ЛВК'],['APP','НАР'],['INT','ИНТ'],['POW','МОЩ'],['EDU','ОБР']];
// book titles: pipeline/source/books.json, the one list of books (Р-148)
const BOOKS = DATA.books;
const METHOD = { book_text: 'сверено с книгой', helper_migration: 'перенесено из веб-помощника', mineru: 'извлечено MinerU', manual: 'введено вручную' };
const CHOOSES = { name:'имя', sex:'пол', age:'возраст', luck:'Удача', skills:'навыки', background:'предыстория' };
const BG = [['description','Описание'],['ideology','Убеждения'],['significant_people','Значимые люди'],['meaningful_locations','Значимые места'],
  ['treasured_possessions','Ценности'],['traits','Черты'],['injuries','Травмы и шрамы'],['phobias_manias','Фобии и мании'],['arcane_tomes','Тайные знания'],['encounters','Встречи со странными сущностями'],['secret','Тайна']];
const FILTERS = {
  creature: [['', 'Все категории'], ...Object.entries(CAT)],
  character: [['', 'Все персонажи'], ['role:npc', 'NPC'], ['era:1920s', 'Эпоха: 1920-е'], ['era:modern', 'Эпоха: современность'],
    ...[...new Set(DATA.characters.map(c => c.sources?.[0]?.book_id))].filter(Boolean).sort().map(b => ['book:' + b, (BOOKS[b] || b).replace(': готовые персонажи', '')])],
  occupation: [['', 'Все профессии'], ['lovecraftian', 'Лавкрафтовские'], ['era:1920s', 'Эпоха: 1920-е'], ['era:modern', 'Эпоха: современность']],
  skill: [['', 'Все категории'], ...[...new Set(DATA.skills.map(s => s.category))].sort().map(c => [c, c])],
  spell: [['', 'Все типы'], ['family', 'Только общие (семейства)'], ...[...new Set(DATA.spells.map(s => s.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru')).map(c => [c, c])],
};
FILTERS.tome = [['', 'Все книги'], ['mythos_tome', 'Книги Мифов'], ['occult_book', 'Оккультные книги'], ['general', 'Только общие записи'],
  ...[...new Set(DATA.tomes.map(t => t.language).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru')).map(l => ['lang:' + l, 'Язык: ' + l])];
const WGROUP = { melee: 'Ближний бой', handgun: 'Пистолеты и револьверы', rifle: 'Винтовки', shotgun: 'Дробовики', automatic: 'Автоматическое оружие', heavy: 'Тяжёлое оружие и взрывчатка', other: 'Прочее' };
// weapon filters: type here, era in its own select (#era)
FILTERS.weapon = [['', 'Все типы'], ...Object.entries(WGROUP)];
// scenario material: sections of the city guide (Р-132), grouped by type
const STORY = [['scenario', 'Сценарии'], ['item', 'Предметы'], ['handout', 'Раздаточные материалы'], ['organization', 'Организации'], ['scene', 'Сцены']];
// a scene lives in the «Сценарии» section, under its scenario (Р-133)
const sectionOf = k => k === 'scene' ? 'scenario' : k;
const STORY_TYPE = { item: 'item_type', handout: 'handout_type', organization: 'org_type' };
FILTERS.location = [['', 'Все места'], ...['город','район','здание','место','область'].map(x => [x, x[0].toUpperCase() + x.slice(1)])];
// city helpers (Р-78): which city a place belongs to, who lives in a city
// top-level city of a place (an underwater city like Y'ha-nthlei inside Innsmouth's outskirts is not a separate city)
const cityOf = l => { let x = l; while (x && x.part_of && byId(x.part_of)) x = byId(x.part_of); return x && x.location_type === 'город' ? x : null; };
const placesIn = id => DATA.locations.filter(x => x.part_of === id).flatMap(x => [x, ...placesIn(x.id)]);
function cityResidents(cityId) {
  const seen = new Set();
  [byId(cityId), ...placesIn(cityId)].filter(Boolean).forEach(l => (l.residents||[]).forEach(r => seen.add(r.id)));
  return [...seen].map(byId).filter(Boolean).sort((a, b) => a.name.ru.localeCompare(b.name.ru, 'ru'));
}
const CITIES = DATA.locations.filter(x => x.location_type === 'город' && !x.part_of).sort((a, b) => a.name.ru.localeCompare(b.name.ru, 'ru'));
FILTERS.character.splice(1, 0, ...CITIES.map(c => ['city:' + c.id, 'Жители: ' + c.name.ru]));
let city = CITIES[0]?.id || null, locMode = 'houses', citySection = 'overview';
// sections of the city reference page shown from the sub-bar («Кто где живёт» gave way to the «Жители» tree, Р-121);
// the scenario's scenes, items, handouts and organizations are sections of the same guide (Р-132)
const CITY_SECTIONS = [['overview', 'Обзор'], ['map', 'Карта'], ['history', 'История'], ['tables', 'Таблицы'], ['leads', 'Зацепки'],
  ['scenario', 'Сценарии'], ['item', 'Предметы'], ['handout', 'Документы'], ['organization', 'Организации']];
const openDist = new Set();
// scenario material (Р-128): items, handouts, organizations, scenes live in the city guide (Р-132)
['items', 'handouts', 'organizations', 'scenes', 'scenarios'].forEach(k => DATA[k] = DATA[k] || []);
const SET = { creature: DATA.creatures, character: DATA.characters, skill: DATA.skills, occupation: DATA.occupations, spell: DATA.spells, tome: DATA.tomes, weapon: DATA.weapons, location: DATA.locations,
  item: DATA.items, handout: DATA.handouts, organization: DATA.organizations, scene: DATA.scenes, scenario: DATA.scenarios };
const ALL = Object.values(SET).flat();
const TOME_TYPE = { mythos_tome: 'книга Мифов', occult_book: 'оккультная книга' };
const byId = id => ALL.find(x => x.id === id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bookOf = c => c.sources?.[0]?.book_id;
const kindOf = c => c.kind;
// a link carries the record's real address, so «open in new tab» works; a plain click is handled in place (show)
const hashOf = c => '#' + encodeURIComponent(c.kind + '/' + c.id.split(/[:/]/).pop());
const link = (id, text) => `<a href="${byId(id) ? esc(hashOf(byId(id))) : '#'}" data-go="${esc(id)}">${esc(text)}</a>`;
let tab = 'creature', current = null;

const occOf = c => c.occupation_ref ? c.occupation_ref : (c.occupation?.ru || '').trim().toLowerCase();
// quotes are ignored in search: «кольт m1911» finds «Кольт» M1911
const norm = s => (s || '').toLowerCase().replace(/[«»"„“”']/g, '');
const nameHit = (c, q) => [c.name.ru, c.name.en, ...(c.aliases||[]), c.occupation?.ru].some(n => norm(n).includes(q));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
// search relevance: 0 the name starts with the query … 7 only the occupation matches; the alias that matched is returned to show it
function hitRank(c, q) {
  const low = norm, word = new RegExp('(^|[\\s(-])' + reEsc(q));
  const ru = low(c.name.ru), en = low(c.name.en);
  if (ru.startsWith(q)) return [0];
  if (word.test(ru)) return [1];
  if (ru.includes(q)) return [2];
  if (word.test(en)) return [3];
  if (en.includes(q)) return [4];
  const a = (c.aliases||[]).find(x => low(x).includes(q));
  if (a) return [word.test(low(a)) ? 5 : 6, a];
  return [7];
}
function matches(c, q, f) {
  if (q && !nameHit(c, q)) return false;
  const o = document.getElementById('occ').value;
  if (tab === 'character' && o && occOf(c) !== o) return false;
  const mech = document.getElementById('mech').value;
  if (tab === 'spell' && mech && c.mechanic !== mech) return false;
  if (tab === 'weapon') {
    const e = document.getElementById('era').value;
    if (e && !(c.axes?.era||[]).some(x => x === e || x === 'any')) return false;
    return !f || c.group === f;
  }
  if (!f) return true;
  if (tab === 'creature') return c.category === f;
  if (tab === 'character' && f.startsWith('city:')) return cityResidents(f.slice(5)).some(x => x.id === c.id);
  if (tab === 'character') { const [k, v] = f.split(':'); return k === 'role' ? (c.roles||[]).includes(v) : k === 'era' ? (c.axes?.era||[]).includes(v) : bookOf(c) === v; }
  if (tab === 'occupation') return f === 'lovecraftian' ? c.lovecraftian : (c.axes?.era||[]).includes(f.split(':')[1]);

function refLinks(ids) {

// several links go one per line; a single one stays a line of text
const linkList = xs => xs.length > 1 ? `<ul>${xs.map(x => `<li>${x}</li>`).join('')}</ul>` : `<p>${xs[0] || ''}</p>`;
const refItems = ids => (ids||[]).map(i => byId(i) ? link(i, byId(i).name.ru) : esc(i));
// «;» and «:» outside brackets and quotes: [positions of «;», position of the first «:»]
function topMarks(s) {
  const semi = [];
  let depth = 0, colon = -1;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if ('(«['.includes(ch)) depth++;
    else if (')»]'.includes(ch)) depth = Math.max(0, depth - 1);
    else if (!depth && ch === ';') semi.push(i);
    else if (!depth && ch === ':' && colon < 0) colon = i;
  }
  return [semi, colon];
}
// descriptions with lists: a sentence that enumerates through «;» (two or more) becomes a list, the words up to a
// colon before the first «;» being its lead; paragraphs starting with «•» are list items; the rest stays as written
function richText(t) {
  const out = [];
  let bullets = [];
  const flush = () => { if (bullets.length) out.push(`<ul>${bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`); bullets = []; };
  for (const para of (t || '').split('\n').filter(x => x.trim())) {
    if (/^\s*•/.test(para)) { bullets.push(para.replace(/^\s*•\s*/, '')); continue; }
    flush();
    let run = [];
    const end = () => { if (run.length) out.push(`<p>${esc(run.join(' '))}</p>`); run = []; };
    for (const s of para.split(/(?<=[.!?…])\s+(?=[А-ЯЁA-Z«(])/)) {
      const [semi, colon] = topMarks(s);
      if (semi.length < 2) { run.push(s); continue; }
      const cut = colon >= 0 && colon < semi[0] ? colon + 1 : 0;
      if (cut) run.push(s.slice(0, cut));
      end();
      const items = [], at = [cut, ...semi.map(i => i + 1)];
      at.forEach((from, k) => items.push(s.slice(from, k + 1 < at.length ? at[k + 1] - 1 : s.length).trim()));
      out.push(`<ul>${items.filter(Boolean).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`);
    }
    end();
  }
  flush();
  return out.join('');
}

const REL = {

  instance_of: ['Вид', 'Особи и персонажи этого вида'],
  avatar_of: ['Аватар божества', 'Аватары'],

function relLinks(items) {
  return items.map(([id, note]) => (byId(id) ? link(id, byId(id).name.ru) : esc(id)) + (note ? ` <span class="muted">(${esc(note)})</span>` : '')).join(', ');
}
function relations(c) {
  const rows = [];
  for (const [type, [fwd, rev]] of Object.entries(REL)) {
    const out = (c.relations||[]).filter(r => r.type === type).map(r => [r.target, r.note]);
    const inc = ALL.flatMap(x => (x.relations||[]).filter(r => r.type === type && r.target === c.id).map(r => [x.id, r.note_back ?? (['relative_of', 'knows', 'rival_of', 'works_for', 'variant_of'].includes(type) ? null : r.note)]));
    // instance_of to a group-profile character (Р-122): «Профиль» on the fighter, «По этому профилю» on the profile
    if (type === 'instance_of' && c.kind === 'character') {
      const prof = out.filter(([id]) => byId(id)?.kind === 'character');
      const kind = out.filter(([id]) => byId(id)?.kind !== 'character');
      if (kind.length) rows.push(`<dt>${fwd}</dt><dd>${relLinks(kind)}</dd>`);
      if (prof.length) rows.push(`<dt>Профиль</dt><dd>${relLinks(prof)}</dd>`);
      if (inc.length) rows.push(`<dt>По этому профилю</dt><dd>${relLinks(inc)}</dd>`);
      continue;
    }
    if (rev === null) {
      // symmetric relation: both directions in one row, without duplicates
      const all = [...out, ...inc.filter(([id]) => !out.some(([o]) => o === id))];
      if (all.length) rows.push(`<dt>${fwd}</dt><dd>${relLinks(all)}</dd>`);
      continue;
    }
    if (out.length) rows.push(`<dt>${fwd}</dt><dd>${relLinks(out)}</dd>`);
    if (inc.length) rows.push(`<dt>${rev}</dt><dd>${relLinks(inc)}</dd>`);
  }
  const same = (c.same_as||[]).filter(byId);
  if (same.length) rows.push(`<dt>То же существо</dt><dd>${refLinks(same)}</dd>`);
  return rows.length ? `<section><h3>Связи</h3><dl>${rows.join('')}</dl></section>` : '';
}

// maps (Р-120): a book map with spots over the printed numbers; a spot opens a place or another map of the same city

function lightSpots(id) {

  const ids = !c ? [] : c.kind === 'location' ? mapIds(c) : DATA.locations.filter(l => (l.residents||[]).some(r => r.id === c.id)).map(l => l.id);
  const zone = !!(c?.along||[]).length;
  const dist = !zone && c?.kind === 'location' && mapCur.spots.some(s => s.target !== c.id && ids.includes(s.target));
  inner.querySelectorAll('.spot[data-i]').forEach(b => {

  inner.querySelectorAll('.rdot').forEach(b => b.classList.toggle('lit', !!c && (c.kind === 'location' ? ids.includes(b.dataset.loc) : b.dataset.r === c.id)));

    ${c.mechanics ? sec('Механика', paraBlock(c.mechanics.ru)) : ''}
    ${c.outcome ? sec('Исход', paraBlock(c.outcome.ru)) : ''}
    ${(c.leads_to||[]).length ? sec('Ведёт к', linkList(refItems(c.leads_to))) : ''}
    ${(c.refs||[]).length ? sec('Связано', linkList(refItems(c.refs))) : ''}
    ${back.length ? sec('Упоминается в', linkList(back.map(x => link(x.id, x.name.ru)))) : ''}
    ${errata(c)}
    <section><h3>Источник</h3><div>${sources(c)}</div></section>
    ${corrections(c)}`;
}
// the reverse side on people, creatures, places, books and spells: memberships, things held, scenes, what is found here
function storyLinks(c) {
  const rows = [];
  const add = (label, xs) => { if (xs.length) rows.push(`<dt>${label}</dt><dd>${xs.join(', ')}</dd>`); };
  const role = (x, r) => link(x.id, x.name.ru) + (r ? ` <span class="muted">(${esc(r)})</span>` : '');
  const here = xs => (xs||[]).some(x => x.location === c.id);
  add('Состоит в', DATA.organizations.flatMap(o => (o.members||[]).filter(m => m.id === c.id).map(m => role(o, m.role))));
  add('Владеет', DATA.items.flatMap(i => (i.held_by||[]).filter(m => m.id === c.id).map(m => role(i, m.role))));
  add('Участвует в сценах', DATA.scenes.flatMap(s => (s.participants||[]).filter(m => m.id === c.id).map(m => role(s, m.role))));
  add('Здесь находятся', [...DATA.items, ...DATA.handouts].filter(x => here(x.found_at)).map(x => link(x.id, x.name.ru)));
  add('Здесь базируются', DATA.organizations.filter(o => here(o.based_at)).map(o => link(o.id, o.name.ru)));
  add('Сцены здесь', DATA.scenes.filter(s => here(s.where)).map(s => link(s.id, s.name.ru)));
  add('Упоминается в сюжете', storyAll().filter(x => pointsAt(x).includes(c.id)).map(x => link(x.id, x.name.ru)));
  return rows.length ? `<section><h3>Сюжет</h3><dl>${rows.join('')}</dl></section>` : '';
}

// «Все гайды» opens on a page about the guides: each guide book, its scenarios and its cities in short;
// the list on the left starts folded
function guidesHome() {
  const short = t => { const p = (t || '').split('\n')[0]; return p.length > 360 ? p.slice(0, p.lastIndexOf(' ', 360)) + '…' : p; };
  return '<h2>Гайды</h2><div class="sub">книги, которые описывают города, и сами города</div>' + GUIDES.map(g => {
    const cs = CITIES.filter(c => bookIds(c).includes(g) || placesIn(c.id).some(l => bookIds(l).includes(g)));
    const scen = DATA.scenarios.filter(s => bookOf(s) === g && !s.part_of).sort(byOrder);
    return `<section><h3>${esc(BOOKS[g] || g)}</h3>
      ${scen.length ? `<p><span class="muted">Сценарии:</span> ${scen.map(s => link(s.id, s.name.ru)).join(', ')}</p>` : ''}
      ${cs.map(c => `<div class="gcity"><h4>${link(c.id, c.name.ru)}</h4>${c.description?.ru ? `<p>${esc(short(c.description.ru))}</p>` : ''}
        <p class="muted">${[`мест: ${placesIn(c.id).length}`, `жителей: ${cityResidents(c.id).length}`, mapsOf(c.id).length ? `карт: ${mapsOf(c.id).length}` : ''].filter(Boolean).join(' · ')}</p></div>`).join('')}
    </section>`;
  }).join('');
}
function showGuides(how = 'push') {
  current = null; citySection = 'overview';
  openCity.clear(); openDist.clear();
  if (tab !== 'location') setTab('location', true);
  renderSubbar();
  renderList();
  const card = document.getElementById('card');
  card.classList.remove('wide');
  card.innerHTML = guidesHome();
  // a city opened from here unfolds in the list
  card.querySelectorAll('[data-go]').forEach(a => a.onclick = e => { if (e.ctrlKey || e.metaKey || e.shiftKey || e.button) return; e.preventDefault(); const x = byId(a.dataset.go); if (x?.kind === 'location') openCity.add(x.id); show(a.dataset.go); });
  if (how === 'replace') history.replaceState(null, '', '#location');
  else if (how === 'push' && location.hash !== '#location') history.pushState(null, '', '#location');
  window.scrollTo(0, 0);
}
// how: 'push' — new history entry (clicks, tab switch), 'replace' — first load, 'none' — back/forward
function show(id, how = 'push') {
  const c = id && byId(id);
  if (!c) { document.getElementById('card').innerHTML = '<p class="muted">Нет записей.</p>'; renderList(); return; }
  const stay = tab === 'location' && locMode === 'residents' && city && (c.kind === 'character' || c.kind === 'creature');
  if (c.kind === 'location') {
    const cc = cityOf(c);
    // opening a place expands its city; opening the city itself leaves the toggle alone
    if (cc) { city = cc.id; if (cc.id !== c.id) openCity.add(cc.id); }
    // opening a place expands its district and the building it is in; opening the district itself leaves the toggle alone
    for (let q = byId(c.part_of); q && q.id !== city; q = byId(q.part_of)) openDist.add(q.id);
    // «Жители» lists only places with residents: a place without them switches the list back to «Дома»
    if (locMode === 'residents' && c.location_type !== 'город' && !resIn(c)) locMode = 'houses';
  }
  // a scenario record opens inside its city's guide, with its section marked
  if (SET[c.kind] && STORY.some(([k]) => k === c.kind)) {
    const cs = storyCities(c);
    if (cs.length && !cs.includes(city)) city = cs[0];
    if (city) openCity.add(city);
    citySection = sectionOf(c.kind);
    // the list unfolds the scenario and stage the record belongs to
    const up = c.kind === 'scene' ? byId(c.arc?.scenario) : c.kind === 'scenario' ? c : null;
    if (up) { openScen.add(up.id); if (up.part_of) openScen.add(up.part_of); }
    if (c.kind === 'scene' && c.arc) partState.set(c.arc.scenario + '|' + (c.arc.part || ''), true);
  }
  // current first: the sub-bar marks «Обзор / Карта / …» only while the city page itself is open
  current = id;
  if (tabFor(c.kind) !== tab && !stay) setTab(tabFor(c.kind), true);
  if (tab === 'location') renderSubbar();
  renderList();
  const card = document.getElementById('card');
  card.innerHTML = c.kind === 'scenario' ? scenarioCard(c) : STORY.some(([k]) => k === c.kind) ? storyCard(c) : c.kind === 'creature' ? creatureCard(c) : c.kind === 'character' ? characterCard(c) : c.kind === 'occupation' ? occupationCard(c) : c.kind === 'spell' ? spellCard(c) : c.kind === 'tome' ? tomeCard(c) : c.kind === 'weapon' ? weaponCard(c) : c.kind === 'location' ? locationCard(c) : skillCard(c);
  // Ctrl/Shift/⌘-click and the middle button are left to the browser (new tab or window at the link's address)
  card.querySelectorAll('[data-go]').forEach(a => a.onclick = e => { if (e.ctrlKey || e.metaKey || e.shiftKey || e.button) return; e.preventDefault(); if (a.dataset.sec) citySection = a.dataset.sec; show(a.dataset.go); });
  card.querySelectorAll('[data-onmap]').forEach(a => a.onclick = e => { e.preventDefault(); openOnMap(a.dataset.onmap); });
  fillToc();
  const onMapPage = c.kind === 'location' && c.location_type === 'город' && !c.part_of && citySection === 'map';
  card.classList.toggle('wide', onMapPage);
  const atMap = onMapPage && initMap(c.id);
  const hash = hashOf(c);
  if (how === 'replace') history.replaceState(null, '', hash);
  else if (how === 'push' && location.hash !== hash) history.pushState(null, '', hash);
  // the page scrolls to the map only for «Показать на карте» and for «Назад» back to a remembered view; any other click starts at the top
  atMap === 'focus' || (atMap === 'view' && how === 'none') ? document.getElementById('mapwrap').scrollIntoView() : window.scrollTo(0, 0);
}

document.getElementById('q').oninput = renderList;
document.getElementById('cat').onchange = renderList;
document.getElementById('occ').onchange = renderList;
document.getElementById('era').onchange = renderList;
document.getElementById('mech').onchange = renderList;
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
// sort by name without leading quotes («Браунинг» M1918 goes under Б)
const sortName = c => c.name.ru.replace(/^[«"„.\s]+/, '');
Object.values(SET).forEach(s => s.sort((a, b) => sortName(a).localeCompare(sortName(b), 'ru')));
function fromHash() {
  const [hk, hs] = decodeURIComponent(location.hash.slice(1)).split('/');
  return hs && SET[hk] ? SET[hk].find(c => c.id.split(/[:/]/).pop() === hs) : null;
}
const start = fromHash();
// a bare #<kind> (links from the landing page) opens that tab
const hashKind = decodeURIComponent(location.hash.slice(1)).split('/')[0];
setTab(tabFor(start ? start.kind : SET[hashKind] ? hashKind : 'creature'), true);
start ? show(start.id, 'replace') : tab === 'location' && guide === 'all' ? showGuides('replace') : show(SET[tab][0]?.id, 'replace');
// back/forward between pushed entries fires popstate; a hand-edited hash fires hashchange; a bare #location is the guides page
const fromHistory = () => { const c = fromHash(); if (c && c.id !== current) show(c.id, 'none'); else if (!c && location.hash === '#location' && current !== null) showGuides('none'); };
window.addEventListener('popstate', fromHistory);
window.addEventListener('hashchange', fromHistory);
// Basic-auth session on the site: whoami.html is an SSI echo of $remote_user (raw SSI text when opened locally)
// built from location.origin: a page opened as https://user:pass@host/ cannot fetch relative URLs
const whoamiUrl = new URL('whoami.html', location.origin + location.pathname).href;
fetch(whoamiUrl, { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(name => {
  name = name.trim();
  if (!name || name.includes('<!--')) return;
  document.getElementById('who-name').textContent = name;
  document.getElementById('who').hidden = false;
}).catch(() => {});
// Basic auth has no logout: a request with bogus credentials makes the browser drop the saved ones
document.getElementById('logout').onclick = () => {
  const xhr = new XMLHttpRequest();
  xhr.open('GET', whoamiUrl, true, 'logout', 'logout');
  xhr.onloadend = () => location.replace(new URL('./', location.origin + location.pathname).href);
  xhr.send();
};
</script>
